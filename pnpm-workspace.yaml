packages:
  - apps/*
  - packages/*

# Explicit allowlist of dependencies permitted to run install (build) scripts.
allowBuilds:
  esbuild: true

# Single source of truth for third-party versions across the monorepo.
# Workspaces reference them with "catalog:".
catalog:
  # ESLint is held at 9.x until eslint-plugin-jsx-a11y supports 10.x.
  '@eslint/js': ^9.39.5
  '@fastify/cors': ^11.3.1
  '@fastify/helmet': ^13.2.0
  '@fastify/rate-limit': ^11.2.1
  '@fastify/swagger': ^9.9.2
  '@fastify/swagger-ui': ^6.1.2
  # React Router 8 is ESM-only and `react-router-dom` no longer exists; import
  # from `react-router`. `@react-router/dev` is framework mode (apps/web only,
  # ADR-022) and must track `react-router` exactly.
  '@react-router/dev': ^8.4.0
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/react-query': ^5.104.4
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.8
  '@types/node': ^26.6.5
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.2
  '@vitest/coverage-v8': ^5.0.5
  eslint: ^9.39.5
  eslint-config-prettier: ^10.1.8
  eslint-plugin-jsx-a11y: ^6.10.2
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.5.7
  fastify: ^5.12.7
  fastify-type-provider-zod: ^7.0.0
  globals: ^17.13.0
  # Required by React Router's default server entry (used to prerender); the
  # framework adds it automatically if it is missing, so pin it here instead.
  isbot: ^5.2.2
  jsdom: ^30.1.3
  pino: ^10.4.0
  pino-pretty: ^13.2.0
  prettier: ^3.9.10
  react: ^19.3.1
  react-dom: ^19.3.1
  react-router: ^8.4.0
  tailwindcss: ^4.3.3
  tsx: ^4.23.15
  typescript: ^5.9.3
  typescript-eslint: ^8.71.2
  vite: ^8.3.4
  vitest: ^5.0.5
  zod: ^4.6.7
